name: Aegis Nobet Release Readiness

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-and-web:
    name: Schema, Command Web and No-Mock Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: mkdir -p coverage && npx vitest run --reporter=default --reporter=json --outputFile=coverage/test-results.json
      - run: npm run build
      - run: npm run check:no-mock

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-vitest-report
          path: coverage/test-results.json

  cloud-correlator:
    name: Cloud Correlator Security and Integration
    runs-on: ubuntu-latest
    needs: schema-and-web

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm --prefix apps/cloud-correlator run lint
      - run: npm --prefix apps/cloud-correlator run test
      - run: npm --prefix apps/cloud-correlator run build

  windows-agent:
    name: Windows Rust Agent
    runs-on: windows-latest
    needs: schema-and-web
    if: ${{ hashFiles('apps/agent-windows/**') != '' }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Format, lint and test
        working-directory: apps/agent-windows
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  macos-agent:
    name: macOS Swift Agent
    runs-on: macos-15
    needs: schema-and-web
    if: ${{ hashFiles('apps/agent-macos/**') != '' }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build and test
        working-directory: apps/agent-macos
        run: |
          swift build
          swift test

  android-agent:
    name: Android Duty Mode
    runs-on: ubuntu-latest
    needs: schema-and-web
    if: ${{ hashFiles('apps/mobile-android/**') != '' }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - name: Lint and unit test
        working-directory: apps/mobile-android
        run: |
          ./gradlew lintDebug
          ./gradlew testDebugUnitTest

  ios-command-center:
    name: iOS Command Center
    runs-on: macos-15
    needs: schema-and-web
    if: ${{ hashFiles('apps/mobile-ios/**') != '' }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build and test
        working-directory: apps/mobile-ios
        run: |
          swift build
          swift test

  sbom-and-license-gate:
    name: CycloneDX SBOM and License Gate
    runs-on: ubuntu-latest
    needs:
      - schema-and-web
      - cloud-correlator

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p sbom
          npx --yes @cyclonedx/cyclonedx-npm \
            --output-file sbom/aegis-nobet.cdx.json \
            --output-format JSON \
            --spec-version 1.6 \
            --omit dev \
            --gather-license-texts

      - name: License gate
        run: |
          node scripts/license-gate.mjs \
            --sbom sbom/aegis-nobet.cdx.json \
            --deny GPL-3.0-only,GPL-3.0-or-later,AGPL-3.0-only,AGPL-3.0-or-later,SSPL-1.0,ELv2 \
            --require-license

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aegis-nobet-cyclonedx-sbom
          path: sbom/aegis-nobet.cdx.json

  container-release:
    name: Build Minimal Cloud Correlator Image
    runs-on: ubuntu-latest
    needs:
      - cloud-correlator
      - sbom-and-license-gate

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build image from monorepo root context
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: apps/cloud-correlator/Dockerfile
          push: false
          load: true
          tags: aegis/cloud-correlator:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test health endpoints
        run: |
          docker run --rm -d \
            --name aegis-correlator-smoke \
            -e NODE_ENV=production \
            -e AEGIS_SQLITE_PATH=/tmp/aegis.sqlite \
            -e AEGIS_ALLOWED_ORIGINS=https://console.aegis.example \
            -e AEGIS_SESSION_SECRET="ci-smoke-session-secret-not-for-prod-0123456789" \
            -p 8080:8080 \
            aegis/cloud-correlator:${{ github.sha }}

          sleep 4

          curl --fail http://localhost:8080/healthz
          curl --fail http://localhost:8080/readyz

          docker stop aegis-correlator-smoke
