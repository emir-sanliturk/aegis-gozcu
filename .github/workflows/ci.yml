name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-and-security-checks:
    name: Frontend, License Gate & Full Integration Verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: mkdir -p coverage && npx vitest run --reporter=default --reporter=json --outputFile=coverage/test-results.json
      - run: npm run build
      - run: npm run check:no-mock
      - name: Generate CycloneDX SBOM and verify license gate
        run: |
          mkdir -p sbom
          npx --yes @cyclonedx/cyclonedx-npm \
            --output-file sbom/aegis-nobet.cdx.json \
            --output-format JSON \
            --spec-version 1.6 \
            --omit dev \
            --gather-license-texts
          npm run license:gate

      - name: Upload test report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vitest-coverage-report
          path: coverage/test-results.json

  backend-verification:
    name: Backend Cloud Correlator Checks
    runs-on: ubuntu-latest
    needs: frontend-and-security-checks

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm --prefix apps/cloud-correlator run typecheck
      - run: npm --prefix apps/cloud-correlator run test
      - run: npm --prefix apps/cloud-correlator run build
      - run: npm --prefix backend run typecheck
      - run: npm --prefix backend run test
      - run: npm --prefix backend run build
