name: aegis-gozcu

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_AEGIS_API_ORIGIN: ${AEGIS_PUBLIC_API_ORIGIN:-/api}
    image: aegis-gozcu-frontend:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      cloud-correlator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - aegis-public
      - aegis-internal

  cloud-correlator:
    build:
      context: .
      dockerfile: apps/cloud-correlator/Dockerfile
    image: aegis-gozcu-correlator:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8080"
      AEGIS_READY: "true"
      AEGIS_SQLITE_PATH: /var/lib/aegis/aegis.sqlite
      AEGIS_ALLOWED_ORIGINS: ${AEGIS_ALLOWED_ORIGINS:?Set AEGIS_ALLOWED_ORIGINS}
      AEGIS_SESSION_SECRET_FILE: /run/secrets/aegis_session_secret
      AEGIS_IP_PEPPER_FILE: /run/secrets/aegis_ip_pepper
      AEGIS_DATABASE_URL: postgresql://aegis_app@postgres:5432/aegis
    secrets:
      - aegis_session_secret
      - aegis_ip_pepper
      - postgres_password
    volumes:
      - aegis_sqlite:/var/lib/aegis
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "fetch('http://127.0.0.1:8080/readyz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    networks:
      - aegis-internal
    expose:
      - "8080"

  postgres:
    image: postgres:17-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
      POSTGRES_USER: ${POSTGRES_USER:-aegis_app}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - aegis-internal
    expose:
      - "5432"

secrets:
  aegis_session_secret:
    file: ./deploy/secrets/aegis_session_secret.txt
  aegis_ip_pepper:
    file: ./deploy/secrets/aegis_ip_pepper.txt
  postgres_password:
    file: ./deploy/secrets/postgres_password.txt

networks:
  aegis-public:
    driver: bridge
  aegis-internal:
    internal: true

volumes:
  aegis_sqlite:
  postgres-data:
